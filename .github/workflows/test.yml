name: Test

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

env:
  EXPECTED_GO_VERSION: go1.27.0
  GOVULNCHECK_VERSION: v1.6.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go toolchain
        run: |
          go version
          go env GOVERSION GOTOOLCHAIN GOPROXY GOSUMDB
          test "$(go env GOVERSION)" = "${EXPECTED_GO_VERSION}"

      - name: Verify dependency files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Test with race detector and coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - name: Fuzz Junos XML parser
        run: go test . -run=^$ -fuzz=FuzzParse -fuzztime=10s

      - name: Build and smoke test CLI
        run: |
          go build -trimpath -o "${RUNNER_TEMP}/routecompare" ./cmd/routecompare
          test "$("${RUNNER_TEMP}/routecompare" -version)" = "$(go run ./cmd/routecompare -version)"
          "${RUNNER_TEMP}/routecompare" \
            -pre testdata/fixtures/pre_1.xml \
            -post testdata/fixtures/post_1.xml \
            -format html \
            -output "${RUNNER_TEMP}/route-report.html"
          "${RUNNER_TEMP}/routecompare" \
            -batch testdata/batch.json \
            -format junit \
            -output "${RUNNER_TEMP}/route-results.xml" || test "$?" -eq 2
          test -s "${RUNNER_TEMP}/route-report.html"
          test -s "${RUNNER_TEMP}/route-results.xml"

      - name: Install govulncheck
        run: |
          mkdir -p "${RUNNER_TEMP}/security-tools"
          GOBIN="${RUNNER_TEMP}/security-tools" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          echo "${RUNNER_TEMP}/security-tools" >> "${GITHUB_PATH}"

      - name: Go source vulnerability scan
        run: govulncheck -show verbose ./...

      - name: Go test vulnerability scan
        run: govulncheck -test -show verbose ./...

      - name: Build and scan every command binary
        run: scripts/scan-go-binaries.sh "${RUNNER_TEMP}/security-scan"

      - name: Security static analysis
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -exclude-generated -severity high ./...

      - name: Upload coverage and smoke-test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-artifacts
          path: |
            coverage.out
            ${{ runner.temp }}/route-report.html
            ${{ runner.temp }}/route-results.xml
          if-no-files-found: error
